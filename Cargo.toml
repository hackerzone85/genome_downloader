[package]
name        = "genome_downloader"
version     = "0.1.0"
edition     = "2021"
description = "General-purpose bacterial genome downloader from NCBI (RefSeq/GenBank)"
authors     = ["Mahendra Gaur <hackerzone85>"]
license     = "MIT"
repository  = "https://github.com/hackerzone85/genome_downloader"
readme      = "README.md"
keywords    = ["bioinformatics", "genomics", "ncbi", "bacteria", "downloader"]
categories  = ["command-line-utilities", "science"]

[[bin]]
name = "genome_downloader"
path = "src/main.rs"

[dependencies]
anyhow       = "1"
clap         = { version = "4", features = ["derive"] }
csv          = "1"
flate2       = "1"
futures-util = "0.3"
indicatif    = "0.17"
reqwest      = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio        = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto       = true
strip     = true
